services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sunha
      POSTGRES_USER: sunha
      POSTGRES_PASSWORD: sunha
    ports:
      - '5432:5432'
    volumes:
      - sunha_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sunha -d sunha']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sunha_postgres_data:
