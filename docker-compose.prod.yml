services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sunha}
      POSTGRES_USER: ${POSTGRES_USER:-sunha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong database password}
    volumes:
      - sunha_prod_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sunha} -d ${POSTGRES_DB:-sunha}']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-sunha}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sunha}
      DATABASE_CONNECT_ON_BOOT: 'true'
      JWT_SECRET: ${JWT_SECRET:?set a long random JWT secret}
      NODE_ENV: production
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-1048576}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1 minute}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      APP_BASE_URL: ${APP_BASE_URL:-http://kanghan.site}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:3301:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  sunha_prod_postgres:
