services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sunha}
      POSTGRES_USER: ${POSTGRES_USER:-sunha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong database password}
    volumes:
      - sunha_prod_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sunha} -d ${POSTGRES_DB:-sunha}']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-sunha}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sunha}
      DATABASE_CONNECT_ON_BOOT: 'true'
      JWT_SECRET: ${JWT_SECRET:?set a long random JWT secret}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:3301:3001'

volumes:
  sunha_prod_postgres:
