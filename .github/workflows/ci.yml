name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sunha
          POSTGRES_PASSWORD: sunha
          POSTGRES_DB: sunha_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sunha -d sunha_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://sunha:sunha@localhost:5432/sunha_ci
      RUN_INTEGRATION: 'true'
      DATABASE_CONNECT_ON_BOOT: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sunha/api exec prisma validate
      - run: pnpm --filter @sunha/api exec prisma migrate deploy
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: API integration and isolation regression
        run: pnpm --filter @sunha/api test
      - run: pnpm build

  image-scan:
    name: Scan API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          tags: sunha-api:ci
          load: true
          push: false
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sunha-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
